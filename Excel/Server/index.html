<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan & Discover</title>


    <style>

         /* ==========================================
        MAIN PAGE
        ========================================== */

         body {
             background: #111;
             color: white;
             font-family: Arial, sans-serif;
             text-align: center;
             padding: 30px 20px;
             margin: 0;
         }


         h1 {
             margin-bottom: 10px;
         }


         p {
             color: #bbb;
         }


         /* ==========================================
        TAKE PHOTO BUTTON
        ========================================== */

         #photoButton {
             display: inline-block;
             background: #3498db;
             color: white;
             padding: 16px 30px;
             border-radius: 10px;
             font-size: 18px;
             cursor: pointer;
             margin-top: 20px;
         }


             #photoButton:hover {
                 background: #2980b9;
             }


         /* ==========================================
        RESULT
        ========================================== */

         #result {
             background: #222;
             border-radius: 10px;
             padding: 20px;
             margin: 25px auto 10px;
             max-width: 600px;
         }


         /* ==========================================
        CHECK HISTORY BUTTON
        ========================================== */

         #ExcelButton {
             display: inline-block;
             background: #3498db;
             color: white;
             padding: 16px 30px;
             border: none;
             border-radius: 10px;
             font-size: 18px;
             cursor: pointer;
             margin-top: 5px;
         }


             #ExcelButton:hover {
                 background: #2980b9;
             }


         /* ==========================================
        PHOTO PREVIEW
        ========================================== */

         #preview {
             max-width: 100%;
             border-radius: 10px;
             margin-top: 20px;
             display: none;
         }


         /* ==========================================
        LOADING
        ========================================== */

         #loading {
             display: none;
             color: #3498db;
             margin-top: 15px;
         }


         /* ==========================================
        HISTORY SCREEN
        ========================================== */

         #historyScreen {
             display: none;
         }


         /* ==========================================
        BACK BUTTON
        ========================================== */

         #BackButton {
             display: inline-block;
             background: #3498db;
             color: white;
             padding: 16px 30px;
             border: none;
             border-radius: 10px;
             font-size: 18px;
             cursor: pointer;
             margin-top: 5px;
         }


             #BackButton:hover {
                 background: #2980b9;
             }


         /* ==========================================
        HISTORY BOX
        ========================================== */

         #historyBox {
             background: #222;
             border-radius: 10px;
             padding: 20px;
             margin: 25px auto;
             max-width: 600px;
             text-align: left;
         }
    </style>

</head>
<body>
    <!-- ==================================================
         MAIN SCREEN
         ================================================== -->

    <div id="mainScreen">


        <h1>
            🔎 Scan & Discover
        </h1>


        <p>
            Take a photo of something and I'll analyse it.
        </p>


        <!-- TAKE PHOTO -->

        <label id="photoButton"
               for="photo">
            📷 Take Photo
        </label>


        <input id="photo"
               type="file"
               accept="image/*"
               capture="environment"
               style="display:none">


        <!-- PHOTO PREVIEW -->

        <img id="preview"
             alt="Photo preview">


        <!-- LOADING -->

        <div id="loading">

            🔍 Analysing photo...

        </div>


        <!-- RESULT -->

        <div id="result">

            No photo taken yet.

        </div>


        <!-- CHECK HISTORY -->

        <button id="ExcelButton">

            📊 Check History

        </button>


    </div>



    <!-- ==================================================
         HISTORY SCREEN
         ================================================== -->

    <div id="historyScreen">


        <!-- BACK BUTTON -->

        <button id="BackButton">

            ← Back

        </button>


        <h1>
            📊 Scan History
        </h1>


        <div id="historyBox">

            <p>
                Your scan history will appear here.
            </p>

        </div>


    </div>



    <script>


        /* ==========================================
           GET ELEMENTS
           ========================================== */

        const photoInput =
            document.getElementById("photo");


        const preview =
            document.getElementById("preview");


        const result =
            document.getElementById("result");


        const loading =
            document.getElementById("loading");


        const getHistory =
            document.getElementById("ExcelButton");


        const backButton =
            document.getElementById("BackButton");


        const mainScreen =
            document.getElementById("mainScreen");


        const historyScreen =
            document.getElementById("historyScreen");



        /* ==========================================
           OPEN HISTORY
           ========================================== */

        getHistory.addEventListener(
            "click",
            function () {

                mainScreen.style.display =
                    "none";


                historyScreen.style.display =
                    "block";

            }
        );



        /* ==========================================
           GO BACK
           ========================================== */

        backButton.addEventListener(
            "click",
            function () {

                historyScreen.style.display =
                    "none";


                mainScreen.style.display =
                    "block";

            }
        );



        /* ==========================================
           TAKE PHOTO
           ========================================== */

        photoInput.addEventListener(
            "change",
            async function () {


                const file =
                    this.files[0];


                if (!file) {

                    return;

                }



                /* SHOW PHOTO */

                preview.src =
                    URL.createObjectURL(file);


                preview.style.display =
                    "block";



                /* CLEAR OLD RESULT */

                result.innerText =
                    "";



                /* SHOW LOADING */

                loading.style.display =
                    "block";



                /* PREPARE UPLOAD */

                const formData =
                    new FormData();


                formData.append(
                    "file",
                    file
                );



                /* SEND TO SERVER */

                try {


                    const response =
                        await fetch(
                            "/scan",
                            {
                                method: "POST",
                                body: formData
                            }
                        );



                    const data =
                        await response.json();



                    /* SHOW RESULT */

                    if (data.success) {


                        result.innerText =
                            data.message;


                    }

                    else {


                        result.innerText =
                            "❌ Error: " +
                            data.message;


                    }


                }

                catch (error) {


                    console.error(error);


                    result.innerText =
                        "❌ Could not connect to the server.";


                }



                /* HIDE LOADING */

                loading.style.display =
                    "none";


            }
        );


    </script>

</body>
</html>
