<!DOCTYPE html>

<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan & Discover</title>

    <style>

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #bbb;
        }

        #photoButton {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 16px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        #result {
            background: #222;
            border-radius: 10px;
            padding: 20px;
            margin: 25px auto;
            max-width: 600px;
            white-space: pre-wrap;
            text-align: left;
        }

        #preview {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        #loading {
            display: none;
            color: #3498db;
        }

    </style>

</head>


<body>

    <h1>Scan & Discover</h1>

    <p>
        Take a photo of something and I'll analyse it.
    </p>


    <!-- PHONE CAMERA -->

    <label id="photoButton" for="photo">
        📷 Take Photo
    </label>

    <input
        id="photo"
        type="file"
        accept="image/*"
        capture="environment"
        style="display:none"
    >


    <!-- PHOTO PREVIEW -->

    <img id="preview">


    <!-- STATUS -->

    <div id="loading">
        Analysing photo...
    </div>


    <!-- RESULT -->

    <div id="result">
        No photo taken yet.
    </div>


    <script>

        const photoInput = document.getElementById("photo");
        const preview = document.getElementById("preview");
        const result = document.getElementById("result");
        const loading = document.getElementById("loading");

        photoInput.addEventListener("change", async function() {
            const file = this.files[0];
            if (!file) return;

            // Show preview
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";

            result.innerText = "";
            loading.style.display = "block";

            // Read file as base64 and upload as JSON to /scan_json
            const reader = new FileReader();
            reader.onload = async function() {
                const dataUrl = reader.result; // includes data:image/...;base64,

                try {
                    const response = await fetch('/scan_json', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: dataUrl })
                    });

                    const data = await response.json();

                    if (data.success) {
                        if (data.data && data.data.detections && data.data.detections.length) {
                            result.innerText = JSON.stringify(data.data.detections, null, 2);
                        } else {
                            result.innerText = 'No detections.';
                        }
                    } else {
                        result.innerText = 'Error: ' + (data.message || 'unknown');
                    }
                } catch (error) {
                    console.error(error);
                    result.innerText = 'Could not connect to the server.';
                } finally {
                    loading.style.display = 'none';
                }
            };
            reader.onerror = function() {
                result.innerText = 'Could not read file.';
                loading.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

    </script>

</body>

</html>
