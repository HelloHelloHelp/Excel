<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan & Discover</title>

    <link rel="stylesheet"
          href="/style.css">

</head>
<body>
    <h1>🔎 Scan & Discover</h1>

    <p>
        Point the camera at an object and discover its history.
    </p>


    <!-- CAMERA SCREEN -->

    <div class="camera-container">

        <video id="camera"
               autoplay
               playsinline></video>

    </div>


    <!-- START / STOP BUTTONS -->

    <div class="camera-buttons">

        <button id="startButton"
                onclick="startCamera()">
            Start Camera
        </button>


        <button id="stopButton"
                onclick="stopCamera()"
                disabled>
            Stop Camera
        </button>

    </div>


    <!-- SCAN BUTTON -->

    <button id="scanButton"
            onclick="scanImage()"
            disabled>
        🔍 Scan
    </button>


    <!-- HIDDEN CANVAS -->

    <canvas id="canvas"></canvas>


    <!-- RESULT -->

    <div id="result">

        Press "Start Camera" to begin.

    </div>


    <script>

        let stream = null;


        // =====================================================
        // START CAMERA
        // =====================================================

        async function startCamera() {

            try {

                stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },

                        audio: false

                    });


                const video =
                    document.getElementById("camera");


                video.srcObject =
                    stream;


                // Start = disabled / grey
                document.getElementById(
                    "startButton"
                ).disabled = true;


                // Stop = enabled / red
                document.getElementById(
                    "stopButton"
                ).disabled = false;


                // Scan = enabled
                document.getElementById(
                    "scanButton"
                ).disabled = false;


                document.getElementById(
                    "result"
                ).innerText =
                    "Camera started. Point it at something and press Scan.";

            }


            catch (error) {

                console.error(error);

                document.getElementById(
                    "result"
                ).innerText =
                    "❌ Could not access the camera. Please allow camera permission.";

            }

        }


        // =====================================================
        // STOP CAMERA
        // =====================================================

        function stopCamera() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(function (track) {

                        track.stop();

                    });

                stream = null;

            }


            const video =
                document.getElementById("camera");


            video.srcObject =
                null;


            // Start = enabled / green
            document.getElementById(
                "startButton"
            ).disabled = false;


            // Stop = disabled / grey
            document.getElementById(
                "stopButton"
            ).disabled = true;


            // Scan = disabled
            document.getElementById(
                "scanButton"
            ).disabled = true;


            document.getElementById(
                "result"
            ).innerText =
                "Camera stopped.";

        }


        // =====================================================
        // SCAN IMAGE
        // =====================================================

        async function scanImage() {

            if (!stream) {

                document.getElementById(
                    "result"
                ).innerText =
                    "Please start the camera first.";

                return;

            }


            const video =
                document.getElementById("camera");


            const canvas =
                document.getElementById("canvas");


            // Make sure camera is ready

            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                document.getElementById(
                    "result"
                ).innerText =
                    "Camera is not ready yet.";

                return;

            }


            // Set canvas size

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const context =
                canvas.getContext("2d");


            // Capture camera frame

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Convert image to blob

            canvas.toBlob(
                async function (blob) {

                    const formData =
                        new FormData();


                    formData.append(
                        "file",
                        blob,
                        "scan.jpg"
                    );


                    document.getElementById(
                        "result"
                    ).innerText =
                        "🔍 Analysing image...";


                    try {

                        const response =
                            await fetch(
                                "/scan",
                                {
                                    method: "POST",
                                    body: formData
                                }
                            );


                        const data =
                            await response.json();


                        if (data.success) {

                            document.getElementById(
                                "result"
                            ).innerText =
                                data.message;

                        }

                        else {

                            document.getElementById(
                                "result"
                            ).innerText =
                                "❌ " + data.message;

                        }

                    }


                    catch (error) {

                        console.error(error);

                        document.getElementById(
                            "result"
                        ).innerText =
                            "❌ Could not connect to the server.";

                    }

                },

                "image/jpeg",

                0.9

            );

        }

    </script>

</body>
</html>
