<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan & Discover</title>


    <style>

         /* ==========================================
        MAIN PAGE
        ========================================== */

         body {
             background: #111;
             color: white;
             font-family: Arial, sans-serif;
             text-align: center;
             padding: 30px 20px;
             margin: 0;
         }


         h1 {
             margin-bottom: 10px;
         }


         p {
             color: #bbb;
         }


         /* ==========================================
        TAKE PHOTO BUTTON
        ========================================== */

         #photoButton {
             display: inline-block;
             background: #3498db;
             color: white;
             padding: 16px 30px;
             border-radius: 10px;
             font-size: 18px;
             cursor: pointer;
             margin-top: 20px;
         }


             #photoButton:hover {
                 background: #2980b9;
             }


         /* ==========================================
        PHOTO PREVIEW
        ========================================== */

         #preview {
             max-width: 100%;
             max-height: 400px;
             border-radius: 10px;
             margin-top: 20px;
             display: none;
         }


         /* ==========================================
        LOADING
        ========================================== */

         #loading {
             display: none;
             color: #3498db;
             margin-top: 15px;
             font-size: 18px;
         }


         /* ==========================================
        RESULT
        ========================================== */

         #result {
             background: #222;
             border-radius: 10px;
             padding: 20px;
             margin: 25px auto 10px;
             max-width: 600px;
             white-space: pre-wrap;
             text-align: left;
             line-height: 1.5;
         }


         /* ==========================================
        CHECK HISTORY BUTTON
        ========================================== */

         #ExcelButton {
             display: inline-block;
             background: #3498db;
             color: white;
             padding: 16px 30px;
             border: none;
             border-radius: 10px;
             font-size: 18px;
             cursor: pointer;
             margin-top: 5px;
         }


             #ExcelButton:hover {
                 background: #2980b9;
             }


         /* ==========================================
        HISTORY SCREEN
        ========================================== */

         #historyScreen {
             display: none;
         }


         /* ==========================================
        BACK BUTTON
        ========================================== */

         #BackButton {
             display: inline-block;
             background: #3498db;
             color: white;
             padding: 16px 30px;
             border: none;
             border-radius: 10px;
             font-size: 18px;
             cursor: pointer;
             margin-top: 5px;
         }


             #BackButton:hover {
                 background: #2980b9;
             }


         /* ==========================================
        HISTORY BOX
        ========================================== */

         #historyBox {
             background: #222;
             border-radius: 10px;
             padding: 20px;
             margin: 25px auto;
             max-width: 600px;
             text-align: left;
         }
    </style>

</head>
<body>
    <!-- ==================================================
         MAIN SCREEN
         ================================================== -->

    <div id="mainScreen">


        <h1>
            🔎 Scan & Discover
        </h1>


        <p>
            Take a photo of something and I'll analyse it.
        </p>


        <!-- TAKE PHOTO -->

        <label id="photoButton"
               for="photo">
            📷 Take Photo
        </label>


        <input id="photo"
               type="file"
               accept="image/*"
               capture="environment"
               style="display:none">


        <!-- PHOTO PREVIEW -->

        <img id="preview"
             alt="Photo preview">


        <!-- LOADING -->

        <div id="loading">

            🔍 Analysing photo...

        </div>


        <!-- RESULT -->

        <div id="result">

            No photo taken yet.

        </div>


        <!-- CHECK HISTORY -->

        <button id="ExcelButton">

            📊 Check History

        </button>


    </div>



    <!-- ==================================================
         HISTORY SCREEN
         ================================================== -->

    <div id="historyScreen">


        <!-- BACK BUTTON -->

        <button id="BackButton">

            ← Back

        </button>


        <h1>
            📊 Scan History
        </h1>


        <div id="historyBox">

            <p>
                Your scan history will appear here.
            </p>

        </div>


    </div>



    <script>


        /* ==========================================
           GET ELEMENTS
           ========================================== */

        const photoInput =
            document.getElementById("photo");


        const preview =
            document.getElementById("preview");


        const result =
            document.getElementById("result");


        const loading =
            document.getElementById("loading");


        const getHistory =
            document.getElementById("ExcelButton");


        const backButton =
            document.getElementById("BackButton");


        const mainScreen =
            document.getElementById("mainScreen");


        const historyScreen =
            document.getElementById("historyScreen");



        /* ==========================================
           OPEN HISTORY
           ========================================== */

        getHistory.addEventListener(
            "click",
            function () {

                mainScreen.style.display =
                    "none";


                historyScreen.style.display =
                    "block";

            }
        );



        /* ==========================================
           GO BACK
           ========================================== */

        backButton.addEventListener(
            "click",
            function () {

                historyScreen.style.display =
                    "none";


                mainScreen.style.display =
                    "block";

            }
        );



        /* ==========================================
           TAKE PHOTO
           ========================================== */

        photoInput.addEventListener(
            "change",
            async function () {


                const file =
                    this.files[0];


                if (!file) {

                    return;

                }


                /* ==================================
                   SHOW PHOTO
                   ================================== */

                preview.src =
                    URL.createObjectURL(file);


                preview.style.display =
                    "block";


                /* ==================================
                   CLEAR OLD RESULT
                   ================================== */

                result.innerText =
                    "";


                /* ==================================
                   SHOW LOADING
                   ================================== */

                loading.style.display =
                    "block";


                /* ==================================
                   READ IMAGE
                   ================================== */

                const reader =
                    new FileReader();


                reader.onload =
                    async function () {


                        const dataUrl =
                            reader.result;


                        /* ==============================
                           SEND IMAGE TO SERVER
                           ============================== */

                        try {


                            const response =
                                await fetch(
                                    "/scan_json",
                                    {
                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({
                                                image:
                                                    dataUrl
                                            })
                                    }
                                );


                            const data =
                                await response.json();


                            /* ==============================
                               SHOW RESULT
                               ============================== */
                            if (data.success) {


                                const d = data.data || {};

                                // If a top-level/normalized type is provided show a concise summary
                                if (d.type || d.normalized_type) {


                                    const parts = [];
                                    const typeVal = d.normalized_type || d.type || "unknown";
                                    parts.push("type: " + typeVal);

                                    if (d.confidence !== undefined && d.confidence !== null) {
                                        let conf = d.confidence;
                                        if (typeof conf === "number") {
                                            // assume 0-1 -> percentage
                                            conf = conf <= 1 ? Math.round(conf * 100) + "%" : conf + "";
                                        }
                                        parts.push("confidence: " + conf);
                                    }

                                    if (d.source) {
                                        parts.push("source: " + d.source);
                                    }

                                    // include debug when present for diagnosis
                                    if (d.debug) {
                                        parts.push("\ndebug: " + JSON.stringify(d.debug, null, 2));
                                    }

                                    result.innerText = parts.join("\n");


                                } else if (
                                    d.detections &&
                                    d.detections.length
                                ) {


                                    result.innerText =
                                        JSON.stringify(
                                            d.detections,
                                            null,
                                            2
                                        );


                                }

                                else if (d) {


                                    // Show full data payload for diagnosis when there are no detections
                                    result.innerText =
                                        JSON.stringify(
                                            d,
                                            null,
                                            2
                                        );

                                }

                                else {


                                    result.innerText =
                                        "No detections.";

                                }


                            }

                            else {


                                // show debug info when available to help diagnose no-match cases
                                if (data.debug) {


                                    result.innerText =
                                        "No match. Debug:\n" +
                                        JSON.stringify(
                                            data.debug,
                                            null,
                                            2
                                        );


                                }

                                else if (data.raw) {


                                    result.innerText =
                                        "No match. Raw response:\n" +
                                        JSON.stringify(
                                            data.raw,
                                            null,
                                            2
                                        );


                                }

                                else {


                                    result.innerText =
                                        "❌ Error: " +
                                        (
                                            data.message ||
                                            "Unknown error"
                                        );

                                }

                            }


                        }


                        catch (error) {


                            console.error(error);


                            result.innerText =
                                "❌ Could not connect to the server.";


                        }


                        finally {


                            loading.style.display =
                                "none";

                        }

                    };


                /* ==================================
                   FILE ERROR
                   ================================== */

                reader.onerror =
                    function () {


                        result.innerText =
                            "❌ Could not read file.";


                        loading.style.display =
                            "none";

                    };


                /* ==================================
                   START READING IMAGE
                   ================================== */

                reader.readAsDataURL(file);

            }
        );


    </script>

</body>
</html>
